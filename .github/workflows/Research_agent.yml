name: Research Agent

on:
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest

    env:
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      SEARCH_PROVIDER: ${{ secrets.SEARCH_PROVIDER }}
      DECISION_PROVIDER: disabled
      JEV_ENABLED: false
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Tavily Search
        run: |
          python Agents/Research/tests/test_tavily.py

      - name: Test Decision Agent
        run: |
          python Agents/Decision/tests/test_decision.py

      - name: Test Research Pipeline
        run: |
          python Agents/Research/tests/test_pipeline.py
          
      - name: Test Research Review
        run: |
          python Agents/Research/tests/test_review.py
          
      - name: Test Review Queue
        run: |
          python Agents/Research/tests/test_review_queue.py
          
      - name: Test Publish Gate
        run: |
          python Agents/Research/tests/test_publish_gate.py
      - name: Research Audit
if: always()
run: |
    echo "=== RESEARCH FILES ==="
    find Agents/Research -maxdepth 3 -type f | sort

    echo
    echo "=== RESEARCH CONTRACT ==="
    sed -n '1,260p' Agents/Contracts/research.py

    echo
    echo "=== REVIEW ==="
    sed -n '1,300p' Agents/Research/review.py

    echo
    echo "=== REVIEW STORE ==="
    sed -n '1,300p' Agents/Research/review_store.py

    echo
    echo "=== PUBLISH GATE ==="
    sed -n '1,300p' Agents/Research/publish_gate.py

    echo
    echo "=== PUBLISH GATE TEST ==="
    sed -n '1,180p' Agents/Research/tests/test_publish_gate.py