name: Research Agent

on:
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest

    env:
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      SEARCH_PROVIDER: ${{ secrets.SEARCH_PROVIDER }}
      DECISION_PROVIDER: disabled
      JEV_ENABLED: false
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Tavily Search
        run: |
          python Agents/Research/tests/test_tavily.py

      - name: Test Decision Agent
        run: |
          python Agents/Decision/tests/test_decision.py

      - name: Test Research Pipeline
        run: |
          python Agents/Research/tests/test_pipeline.py

      - name: Test Research Review
        run: |
          python Agents/Research/tests/test_review.py

      - name: Test Review Queue
        run: |
          python Agents/Research/tests/test_review_queue.py

      - name: Test Publish Gate
        run: |
          python Agents/Research/tests/test_publish_gate.py

      - name: Research Audit
        if: always()
        run: |
          echo "============================================================"
          echo "RESEARCH AUDIT"
          echo "============================================================"

          echo
          echo "=== FILES ==="
          find Agents/Research -maxdepth 2 -type f | sort

          echo
          echo "=== REVIEW JSON ==="

          if [ -d Agents/Research/reviews ]; then
            for file in Agents/Research/reviews/*.json; do
              if [ -f "$file" ]; then
                echo "FILE: $file"

                python - "$file" <<'PY'
          import json
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print("product_name:", data.get("product_name"))
          print("product_url:", data.get("product_url"))
          print("status:", data.get("status"))
          print("review_status:", data.get("review_status"))
          print("review_note:", data.get("review_note"))
          print("sources_count:", len(data.get("sources", [])))
          PY
              fi
            done
          else
            echo "Reviews directory does not exist."
          fi

          echo
          echo "=== PUBLISH GATE DIRECT CHECK ==="

          python - <<'PY'
          from Agents.Research.publish_gate import PublishGate
          from Agents.Research.review_store import ReviewStore

          product = "publish_gate_test"

          store = ReviewStore()
          gate = PublishGate()

          path = store.directory / f"{store._safe_filename(product)}.json"

          print("review_file_exists:", path.exists())
          print("can_publish:", gate.can_publish(product))

          if path.exists():
              import json

              data = json.loads(
                  path.read_text(encoding="utf-8")
              )

              print("stored_status:", data.get("status"))
              print(
                  "stored_review_status:",
                  data.get("review_status"),
              )
              print(
                  "stored_product_url:",
                  bool(data.get("product_url")),
              )
              print(
                  "stored_sources:",
                  len(data.get("sources", [])),
              )

          if path.exists():
              path.unlink()

          print("temporary_test_file_removed: True")
          PY

          echo
          echo "============================================================"
          echo "AUDIT COMPLETE"
          echo "============================================================"