name: Research Agent

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      product:
        description: "Product key from affiliates.json (leave empty for the normal batch)"
        required: false
        type: string
        default: ""
      force_research:
        description: "Research an existing product even if it already has content/review data"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest

    env:
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SEARCH_PROVIDER: tavily
      PYTHONPATH: ${{ github.workspace }}
      RESEARCH_REVIEW_DIR: ${{ github.workspace }}/data/research_reviews
      RESEARCH_PRODUCT: ${{ inputs.product }}
      FORCE_RESEARCH: ${{ inputs.force_research }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Decision Agent
        run: python Agents/Decision/tests/test_decision.py

      - name: Test Research Schema
        run: python Agents/Research/tests/test_schema.py

      - name: Test Research Review
        run: python Agents/Research/tests/test_review.py

      - name: Test Review Queue
        run: python Agents/Research/tests/test_review_queue.py

      - name: Test Publish Gate
        run: python Agents/Research/tests/test_publish_gate.py

      - name: Test Publisher
        run: python Agents/Publisher/tests/test_publisher.py

      - name: Test Content Publish
        run: python Agents/Publisher/tests/test_content_publish.py

      - name: Test Research Analyzer
        run: python Agents/Research/tests/test_research_analyzer.py

      - name: Test Research End-to-End
        run: python Agents/Research/tests/test_end_to_end.py

      - name: Test Research Script Targeting
        run: python Agents/Research/tests/test_research_script.py

      - name: Run research for affiliate products
        run: python scripts/research.py

      - name: Show review queue
        run: |
          python - <<'PY'
          from Agents.Research.review_queue import ReviewQueue

          print("Pending reviews:")
          for item in ReviewQueue().list_pending():
              print(f"- {item.get('product_name')}: {len(item.get('sources', []))} sources")
          PY

      - name: Commit research records
        run: |
          git config user.name "Research Agent"
          git config user.email "bot@github.com"
          git add data/research_reviews/

          if git diff --cached --quiet; then
            echo "No research changes to commit."
          else
            git commit -m "research: update product evidence"
            git push
          fi
