name: Research Agent

on:
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest

    env:
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      SEARCH_PROVIDER: ${{ secrets.SEARCH_PROVIDER }}
      DECISION_PROVIDER: disabled
      JEV_ENABLED: false
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Tavily Search
        run: |
          python Agents/Research/tests/test_tavily.py

      - name: Test Decision Agent
        run: |
          python Agents/Decision/tests/test_decision.py

      - name: Test Research Pipeline
        run: |
          python Agents/Research/tests/test_pipeline.py

      - name: Test Research Review
        run: |
          python Agents/Research/tests/test_review.py

      - name: Test Review Queue
        run: |
          python Agents/Research/tests/test_review_queue.py

      - name: Test Publish Gate
        run: |
          python Agents/Research/tests/test_publish_gate.py

      - name: Research Audit
        if: always()
        run: |
          echo "============================================================"
          echo "RESEARCH AUDIT"
          echo "============================================================"

          echo
          echo "=== research.py ==="
          sed -n '1,260p' Agents/Contracts/research.py

          echo
          echo "=== review.py ==="
          sed -n '1,260p' Agents/Research/review.py

          echo
          echo "=== review_store.py ==="
          sed -n '1,300p' Agents/Research/review_store.py

          echo
          echo "=== publish_gate.py ==="
          sed -n '1,260p' Agents/Research/publish_gate.py

          echo
          echo "=== test_publish_gate.py ==="
          sed -n '1,160p' Agents/Research/tests/test_publish_gate.py

          echo
          echo "=== REVIEW JSON FILES ==="
          find Agents/Research/reviews \
            -maxdepth 1 \
            -type f \
            -name "*.json" \
            -print 2>/dev/null || true

          echo
          echo "=== TEST REVIEW JSON ==="

          for file in Agents/Research/reviews/*.json; do
            if [ -f "$file" ]; then
              echo "--- $file ---"
              cat "$file"
            fi
          done

          echo
          echo "============================================================"
          echo "AUDIT COMPLETE"
          echo "============================================================"