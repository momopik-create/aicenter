name: Auto Content Publisher

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      RESEARCH_REVIEW_DIR: ${{ github.workspace }}/data/research_reviews

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run publisher tests
        run: |
          python Agents/Publisher/tests/test_content_publish.py
          python Agents/Publisher/tests/test_publisher.py

      - name: Publish approved research
        run: python scripts/publish.py

      - name: Verify generated content
        run: |
          test -d src/content/products
          find src/content/products -type f -name "*.md" -print

      - name: Commit and push published content
        run: |
          git config user.name "Auto Publisher"
          git config user.email "bot@github.com"
          git add src/content/products/ data/research_reviews/

          if git diff --cached --quiet; then
            echo "No publication changes to commit."
          else
            git commit -m "auto: publish approved product research"
            git push
          fi
