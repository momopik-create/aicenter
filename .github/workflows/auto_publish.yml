name: Auto Content Publisher

on:
  schedule:
    # اجرای خودکار هر روز ساعت ۰۸:۰۰ صبح به وقت UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # امکان اجرای دستی در صورت نیاز

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Review Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/main.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Auto-Publisher"
          git config --global user.email "bot@github.com"
          git add src/content/products/
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: generate new product review" && git push) 
