name: Auto Content Publisher

on:
  schedule:
    # Every day at 08:00 UTC
    - cron: "0 8 * * *"

  # Allow manual execution
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Setup Python
      # --------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # 4. Run Publisher tests
      # --------------------------------------------------

      - name: Run Content Builder Test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python Agents/Publisher/tests/test_content_publish.py

      - name: Run Publisher Agent Test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python Agents/Publisher/tests/test_publisher.py

      # --------------------------------------------------
      # 5. Generate content
      # --------------------------------------------------

      - name: Run AI Review Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/main.py

      # --------------------------------------------------
      # 6. Verify generated content
      # --------------------------------------------------

      - name: Verify Generated Content
        run: |
          echo "Checking generated Astro content..."

          if [ ! -d "src/content/products" ]; then
            echo "ERROR: src/content/products directory does not exist."
            exit 1
          fi

          echo "Generated files:"
          find src/content/products -type f -name "*.md" -print

          if ! find src/content/products -type f -name "*.md" | grep -q .; then
            echo "ERROR: No Markdown content was generated."
            exit 1
          fi

          echo "Generated content verified."

      # --------------------------------------------------
      # 7. Commit generated content
      # --------------------------------------------------

      - name: Commit and Push Changes
        run: |
          git config user.name "Auto-Publisher"
          git config user.email "bot@github.com"

          git add src/content/products/

          if git diff --cached --quiet; then
            echo "No new content changes to commit."
          else
            git commit -m "auto: generate new product review"
            git push
          fi